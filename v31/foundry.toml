# Frozen source of the v3.1 pool and launchpad deployed on Ethereum mainnet and Sepolia. The files under src/ are verbatim
# copies and this profile compiles them exactly as the deployment did, so the bytecode and its metadata hash match the
# chain. Never edit them: the root src/ holds the current protocol. Build: npm run build:v31.
[profile.default]
src = "src"
test = "test"
out = "out"
solc_version = "0.8.26"
optimizer = true
optimizer_runs = 200
libs = ["node_modules"]
remappings = ["@openzeppelin/=node_modules/@openzeppelin/"]

[lint]
lint_on_build = false
