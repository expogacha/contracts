[profile.default]
src = "src"
test = "test"
out = "out"
solc_version = "0.8.26"
optimizer = true
optimizer_runs = 200
libs = ["node_modules"]
remappings = ["@openzeppelin/=node_modules/@openzeppelin/"]

[fuzz]
runs = 256

[invariant]
runs = 128
depth = 64
fail_on_revert = false

[lint]
lint_on_build = false
